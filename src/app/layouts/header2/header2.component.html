<!-- Header Component -->
<header id="header" class="header" [class.scrolled]="isScrolled">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-content">
        <!-- Contact Info -->
        <div class="contact-info">
          <a 
            href="tel:{{ phone }}" 
            class="contact-item phone"
            [attr.aria-label]="'Call ' + phone">
            <i class="icon-phone"></i>
            <span>{{ phone }}</span>
          </a>
          <a 
            href="mailto:{{ email }}" 
            class="contact-item email"
            [attr.aria-label]="'Email ' + email">
            <i class="icon-envelope"></i>
            <span>{{ email }}</span>
          </a>
        </div>

        <!-- Auth Links -->
        <div class="auth-links" *ngIf="user == null">
          <a class="auth-link book-now" (click)="onSignInWithGoogle()">Sign In</a>
        </div>

        <div class="user-info" *ngIf="user">
            <img class="bg-img" [src]="user.photoURL" alt="" [cdkMenuTriggerFor]="searchOverlay">
        </div>
        <ng-template #searchOverlay>
            <div class="profile-menu">
                <div class="overlay" cdkMenu>
                    <ul>
                      <li class="profile-menu-list" title="{{user.displayName}}">{{user.displayName}}</li>
                      <li class="profile-menu-list">
                        <div class="link-menu-item" [routerLink]="'/booking-history'">
                          <svg fill="currentColor" height="200px" width="200px" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <g> <g> <path d="M490.667,0.001H21.333C9.551,0.001,0,9.552,0,21.334v298.667v85.333c0,11.782,9.551,21.333,21.333,21.333H180.24 c-1.864,13.54-7.223,28.443-12.393,32.289l-14.604,10.852c-17.426,12.762-9.526,42.19,13.727,42.19h177.877 c23.176,0,31.133-29.276,13.746-42.192l-14.594-10.839c-5.142-3.82-10.452-18.732-12.273-32.301h158.941 c11.782,0,21.333-9.551,21.333-21.333v-85.333V21.334C512,9.552,502.449,0.001,490.667,0.001z M42.667,42.668h426.667v256H42.667 V42.668z M300.232,469.332H211.64c6.264-12.825,10.34-28.154,11.56-42.665h65.574 C289.964,441.183,293.999,456.51,300.232,469.332z M311.041,384.001c-0.024,0-0.048-0.002-0.072-0.002H201.039 c-0.024,0-0.048,0.002-0.072,0.002H42.667v-42.667h426.667v42.667H311.041z"></path> <path d="M411.582,70.247l-36.418,36.418h-76.497c-11.782,0-21.333,9.551-21.333,21.333c0,11.782,9.551,21.333,21.333,21.333 h33.83l-55.163,55.163l-27.582-27.582c-8.331-8.331-21.839-8.331-30.17,0s-8.331,21.839,0,30.17l42.667,42.667 c8.331,8.331,21.839,8.331,30.17,0l70.248-70.248v33.83c0,11.782,9.551,21.333,21.333,21.333 c11.782,0,21.333-9.551,21.333-21.333v-76.497l36.418-36.418c8.331-8.331,8.331-21.839,0-30.17 C433.42,61.916,419.913,61.916,411.582,70.247z"></path> <path d="M149.333,63.999c-35.355,0-64,28.645-64,64s28.645,64,64,64s64-28.645,64-64S184.689,63.999,149.333,63.999z M149.333,149.332c-11.791,0-21.333-9.542-21.333-21.333s9.542-21.333,21.333-21.333s21.333,9.542,21.333,21.333 S161.125,149.332,149.333,149.332z"></path> </g> </g> </g> </g></svg>
                          <span>My Bookings</span>
                        </div>
                      </li>
                      <li class="profile-menu-list">
                          <a (click)="onSignOut()"><div class="menu-item logout">Sign out</div></a>
                      </li>
                    </ul>
                </div>
            </div>
        </ng-template>
      </div>
    </div>
  </div>

  

  <!-- Main Navigation -->
   <div class="hero-overlay"></div>
  <nav class="main-nav" [class.mobile-open]="isMobileMenuOpen">
    <div class="container">
      <div class="nav-content">
        <!-- Logo -->
        <div class="logo">
          <a href="/" class="logo-link" [attr.aria-label]="'Off 2 Sri Lanka Tours - Home'">
            <div class="logo-icon">
              <img src="assets/images/logo/header-logo-3.png">
            </div>
          </a>
        </div>

        <!-- Desktop Navigation -->
        <div class="nav-menu desktop-nav">
          <ul class="nav-list">
            <li 
              *ngFor="let item of navigationItems" 
              class="nav-item"
              [class.active]="item.route === router.url"
              [class.has-dropdown]="item.hasDropdown"
            >
              <span 
                [routerLink]="item.route" 
                class="nav-link"
                (click)="onNavItemClick(item)"
              >
                {{ item.label }}
                <i *ngIf="item.hasDropdown" class="icon-chevron-down dropdown-icon"></i>
          </span>
              
              <!-- Dropdown Menu (placeholder) -->
              <div *ngIf="item.hasDropdown" class="dropdown-menu">
                <div class="dropdown-content">
                  <span class="dropdown-item" *ngFor="let item of tourTypeList" routerLink='tours' [queryParams]="{id: item.id}">{{item.tourType}}</span>
                </div>
              </div>
            </li>
          </ul>
        </div>

        <!-- Mobile Menu Toggle -->
        <button 
          class="mobile-menu-toggle"
          (click)="toggleMobileMenu()"
          [attr.aria-label]="isMobileMenuOpen ? 'Close menu' : 'Open menu'"
          [attr.aria-expanded]="isMobileMenuOpen"
        >
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" [class.open]="isMobileMenuOpen">

      <!-- User Info -->
      <div class="mobile-user-info" *ngIf="user">
        <div class="mobile-user-header" (click)="toggleUserDropdown()" [class.active]="isUserDropdownOpen">
          <img class="mobile-user-avatar" [src]="user.photoURL" [alt]="user.displayName" title="{{ user.displayName }}">
          <span class="mobile-user-name">{{ user.displayName }}</span>
          <i class="icon-chevron-down dropdown-toggle-icon" [class.rotated]="isUserDropdownOpen"></i>
        </div>
        <div class="mobile-user-dropdown" *ngIf="isUserDropdownOpen">
          <a class="mobile-user-dropdown-item" [routerLink]="'/booking-history'" (click)="toggleUserDropdown(); closeMobileMenu()">
            <svg fill="currentColor" height="18px" width="18px" version="1.1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
              <g><path d="M490.667,0.001H21.333C9.551,0.001,0,9.552,0,21.334v298.667v85.333c0,11.782,9.551,21.333,21.333,21.333H180.24 c-1.864,13.54-7.223,28.443-12.393,32.289l-14.604,10.852c-17.426,12.762-9.526,42.19,13.727,42.19h177.877 c23.176,0,31.133-29.276,13.746-42.192l-14.594-10.839c-5.142-3.82-10.452-18.732-12.273-32.301h158.941 c11.782,0,21.333-9.551,21.333-21.333v-85.333V21.334C512,9.552,502.449,0.001,490.667,0.001z"/></g>
            </svg>
            <span>My Bookings</span>
          </a>
          <a class="mobile-user-dropdown-item" (click)="onSignOut(); closeMobileMenu()">
            <svg fill="currentColor" height="18px" width="18px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            <span>Sign Out</span>
          </a>
        </div>
      </div>

      <div class="mobile-nav-content">
        <ul class="mobile-nav-list">
          <li 
            *ngFor="let item of navigationItems" 
            class="mobile-nav-item"
            [class.active]="item.route === router.url">
            <span
              [routerLink]="item.route"
              class="mobile-nav-link"
              (click)="onNavItemClick(item); closeMobileMenu()">
              {{ item.label }}
              <i class="icon-chevron-right"></i>
            </span>
          </li>
        </ul>

        <!-- Mobile Contact Info -->
        <div class="mobile-contact">
          <h4>Contact Info</h4>
          <a href="tel:{{ phone }}" class="mobile-contact-item">
            <i class="icon-phone"></i>
            <span>{{ phone }}</span>
          </a>
          <a href="mailto:{{ email }}" class="mobile-contact-item">
            <i class="icon-envelope"></i>
            <span>{{ email }}</span>
          </a>
        </div>

        <!-- Mobile Book Now Button -->
        <div *ngIf="!user" class="mobile-sign-in">
          <a class="mobile-signIn-btn" (click)="onSignInWithGoogle(); closeMobileMenu()">Sign In</a>
        </div>

      </div>
    </div>
  </nav>
</header>

<!-- Overlay for mobile menu -->
<div 
  class="mobile-overlay" 
  [class.active]="isMobileMenuOpen"
  (click)="closeMobileMenu()"
  [attr.aria-hidden]="!isMobileMenuOpen"
></div>
