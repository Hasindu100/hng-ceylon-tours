<div class="tour-landing">
  <!-- Hero Section -->
  <section class="hero-section">
    <!-- Background Image Overlay -->
    <div class="hero-overlay"></div>

    <!-- Hero Content -->
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="hero-title">Let's Tour Arround <b>Sri Lanka</b></h1>
        <p class="hero-sub-title">With Safty, Comfort and Friendly Ride</p>
      </div>
    </div>
  </section>

  <!-- Search Section -->
  <section class="search-section">
    <div class="search-container">
      <!-- Tab Navigation -->
      <div class="tab-navigation">
        <button 
          class="tab-button pickup"

          (click)="setActiveTab('airportpickup')">

          Airport Pickup
        </button>
        <button 
          class="tab-button drop" 
          [class.active]="activeTab === 'airportdrop'"
          (click)="setActiveTab('airportdrop')">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--emojione-monotone" preserveAspectRatio="xMidYMid meet" fill="currentColor"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M61.22 4.387C60.286 2.869 58.659 2 56.754 2c-1.108 0-2.248.292-3.388.867c-3.855 1.948-8.762 5.468-13.911 9.919l-10.446-1.161l1.893-1.894l-1.909-1.91l-3.422 3.421l-10.891-1.209l2.27-2.27l-1.911-1.911l-3.797 3.799l-7.97-.886c-1.968-.219-1.588 4.727.7 5.794l22.869 10.66c-4.408 4.925-10.354 12.196-12.55 17.771L4.262 41.876c-.678-.074-.548 1.625.239 1.992c5.061 2.358 7.717 3.597 9.113 4.248c.032.105.075.205.116.305c-1.924 2.323-3.005 4.085-2.614 4.473c.386.385 2.138-.69 4.451-2.608c.104.044.212.087.328.124l4.236 9.091c.368.788 2.068.915 1.993.239l-1.109-10.001c4.861-1.944 11.521-6.907 17.784-12.543l10.639 22.83c1.068 2.293 6.016 2.669 5.797.699l-.886-7.971l3.797-3.796l-1.911-1.911l-2.268 2.269l-1.209-10.892l3.419-3.418l-1.911-1.912l-1.891 1.892l-1.16-10.441c4.453-5.149 7.973-10.056 9.919-13.911c1.125-2.233 1.156-4.51.086-6.247M59.421 9.77c-2.676 5.302-8.707 13.08-16.521 20.892c-8.438 8.44-16.827 14.79-22.108 17.087l-.232-2.098c3.957-4.042 6.65-7.701 6.076-8.283c-.582-.578-4.242 2.117-8.285 6.075l-2.111-.235c2.303-5.28 8.667-13.675 17.1-22.108c7.813-7.812 15.59-13.843 20.891-16.521c.904-.455 1.76-.661 2.524-.661c2.73-.001 4.293 2.625 2.666 5.852" fill="currentColor"></path><path d="M52.743 6.057l-3.295 2.047c1.505-.52 3.557.125 4.748 1.076l2.643-2.642c-1.09-.841-2.61-.981-4.096-.481" fill="currentColor"></path><path d="M54.82 9.804c.95 1.191 1.595 3.243 1.075 4.747l2.047-3.295c.5-1.487.359-3.006-.48-4.095L54.82 9.804" fill="currentColor"></path></g></svg>
          Airport Drop
        </button>
        <button 
          class="tab-button" 
          [class.active]="activeTab === 'tour'"
          (click)="setActiveTab('tour')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M5 17H4C3.44772 17 3 16.5523 3 16V12C3 11.4477 3.44772 11 4 11H5M19 17H20C20.5523 17 21 16.5523 21 16V12C21 11.4477 20.5523 11 20 11H19M5 17C5 18.1046 4.10457 19 3 19H2M5 17V11M19 17C19 18.1046 19.8954 19 21 19H22M19 17V11M5 11H19M5 11L7 6H17L19 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Custom Tour
        </button>
      </div>

      <div class="forms-container">
        <div class="pickup-form" [class.hide-form]="activeTab != 'airportpickup'" @slideLeft>
            <app-airport-pickup-form (openVehicleImagePopup)="onOpenVehicleImagePopup($event)"></app-airport-pickup-form>
        </div>
        <div class="drop-form" [class.hide-form]="activeTab != 'airportdrop'" @slideRight>
            <app-airport-drop-form></app-airport-drop-form>
        </div>
        <div class="custom-tour-form" [class.hide-form]="activeTab != 'tour'" @slideLeft>
            <app-custom-tour-form></app-custom-tour-form>
        </div>
      </div>
    </div>
  </section>
</div>

<app-vehicle-image-popup *ngIf="showVehicleImagePopup" [imageList]="vehicleImagePopupImageList" (closeImagePopup)="onCloseVehicleImagePopup()"></app-vehicle-image-popup>
<app-loader *ngIf="isDataLoading"></app-loader>
